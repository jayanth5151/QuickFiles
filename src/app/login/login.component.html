<div class="login-container">
  <h2>Login</h2>
  <form (ngSubmit)="login()">
    <input
      type="text"
      [(ngModel)]="email"
      name="email"
      placeholder="Email"
      required
    />
    <input
      type="password"
      [(ngModel)]="password"
      name="password"
      placeholder="Password"
      required
    />
    <button type="submit">Login</button>
  </form>

  <h4>OR</h4>
  <form routerLink="/signup">
    <button type="submit">Signup</button>
  </form>
</div>
