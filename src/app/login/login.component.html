<div class="login-container" onload="logout()">
  <h1>Welcome to QuickFiles</h1>
  <p class="subtitle">Please login to continue</p>

  <form (ngSubmit)="login()">
    <input
      type="text"
      [(ngModel)]="email"
      name="email"
      placeholder="Email"
      required
    />
    <input
      type="password"
      [(ngModel)]="password"
      name="password"
      placeholder="Password"
      required
    />
    <button type="submit" class="login-btn">Login</button>
  </form>

  <p class="or-text">OR</p>

  <form routerLink="/signup">
    <button type="submit" class="signup-btn">Signup</button>
  </form>
</div>
