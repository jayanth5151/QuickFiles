<div class="login-container">
  <h1>Create an account</h1>

  <form (ngSubmit)="signup()">
    <input
      type="text"
      [(ngModel)]="signupEmail"
      name="signupEmail"
      placeholder="Email"
      required
    />
    <input
      type="password"
      [(ngModel)]="signupPassword"
      name="signupPassword"
      placeholder="Password"
      required
    />
    <button type="submit" class="login-btn">Signup</button>
  </form>

</div>
