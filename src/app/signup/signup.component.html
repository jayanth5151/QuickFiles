<div class="login-container">

  <h2>Signup</h2>
  <form (ngSubmit)="signup()">
    <input
      type="text"
      [(ngModel)]="signupEmail"
      name="signupEmail"
      placeholder="Email"
      required
    />
    <input
      type="password"
      [(ngModel)]="signupPassword"
      name="signupPassword"
      placeholder="Password"
      required
    />
    <button type="submit">Signup</button>
  </form>
</div>
