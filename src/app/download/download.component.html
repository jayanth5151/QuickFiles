<h2>Available Files</h2>
<table>
  <thead>
    <tr>
      <th>File Name</th>
      <th>Actions</th>
    </tr>
  </thead>
  <tbody>
    <tr *ngFor="let file of files">
      <td>{{ file.name }}</td>
      <td>
        <button (click)="downloadFile(file._id, file.name)">Download</button>
        <button class="delete-btn" (click)="deleteFile(file._id)">
          Delete
        </button>
      </td>
    </tr>
  </tbody>
</table>
